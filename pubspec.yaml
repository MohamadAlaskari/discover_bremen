name: discover_bremen
description: "Discover Bremen - The Fifth Musician. A city walk through the Bremen Town Musicians fairy tale (HSB Bremen, BIP Mobile Programming and Technologies)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  # The only extra package: plays the 11 sound files (lib/services/sound_service.dart).
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # 11 mp3 files synthesized for this project - see assets/sounds/SOUNDS.txt.
  assets:
    - assets/sounds/

# Launcher icon, designed in Figma (page "App Icon") and exported to
# assets/icon/. After changing it, run: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "assets/icon/app_icon_background.png"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#C8232C"
    theme_color: "#C8232C"
