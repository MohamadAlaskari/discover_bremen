name: discover_bremen
description: "Discover Bremen - The Fifth Musician. A city walk through the Bremen Town Musicians fairy tale (HSB Bremen, BIP Mobile Programming and Technologies)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  # The only extra package: plays the 11 sound files (lib/services/sound_service.dart).
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # 11 mp3 files synthesized for this project - see assets/sounds/SOUNDS.txt.
  assets:
    - assets/sounds/
