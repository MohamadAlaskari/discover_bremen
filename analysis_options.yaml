# Static analysis for `flutter analyze`. The project must stay at 0 issues.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    # The package-free SoundService only compiles after it is copied into
    # lib/services/ (see README, "Submitting only lib/").
    - docs/**

linter:
  rules:
    # A few extra rules on top of flutter_lints for consistent, readable code.
    prefer_single_quotes: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_final_locals: true
    sort_constructors_first: true
